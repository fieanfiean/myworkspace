name: Daily Anime Incremental Sync

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-anime-sync
  cancel-in-progress: false

jobs:
  sync-anime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug target
        run: |
          echo "SUPABASE_URL ref: $(echo $SUPABASE_URL | sed 's|https://||;s|\.supabase\.co||')"
          echo "R2_BUCKET_NAME: $R2_BUCKET_NAME"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Sync latest anime pages
        run: npm run sync:anime -- --pages 3 --source "https://ffzy5.tv/api.php/provide/vod/?ac=detail&t=4"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}